# OpenShell SandboxPolicy for the `traces` fleet agent — deny-by-default.
# The traces specialist may reach ONLY the MLflow tracking server for trace
# ingest and queries (telemetry-proxy:8081, read-write); everything else is
# denied. A subset of the governance interceptor's observability-egress
# ceiling (the interceptor only signs access it governs). Module 7 applies
# this at sandbox create:
#   openshell --gateway <gateway> sandbox create --name traces \
#     --from quay.io/rh-ai-quickstart/openclaw-openshell:latest \
#     --policy automation/policies/sandbox-policy-fleet-traces.yaml \
#     --no-tty --detach -- sh -c 'sleep 86400'
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - host: registry.openshell.svc.cluster.local
        port: 4873
        access: read-write
        protocol: rest
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/node
      - path: /usr/local/bin/node

  tool-egress:
    name: tool-egress
    endpoints:
      - host: telemetry-proxy.openshell-agents.svc.cluster.local
        port: 8081
        access: read-write
        protocol: rest
        enforcement: enforce
    binaries:
      - path: /usr/bin/node
      - path: /usr/local/bin/node
