# OpenShell SandboxPolicy for the `analyst` fleet agent — deny-by-default.
# The analyst has NO telemetry egress at all: it reasons over what the
# specialists report and can reach nothing beyond the in-cluster npm
# registry. This is the deny-by-default exhibit — Module 7 verifies from
# outside that it can reach neither Thanos nor MLflow. The zero-egress
# posture is designed into the policy, not trusted away. Module 7 applies
# this at sandbox create:
#   openshell --gateway <gateway> sandbox create --name analyst \
#     --from quay.io/rh-ai-quickstart/openclaw-openshell:latest \
#     --policy automation/policies/sandbox-policy-fleet-analyst.yaml \
#     --no-tty --detach -- sh -c 'sleep 86400'
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - host: registry.openshell.svc.cluster.local
        port: 4873
        access: read-write
        protocol: rest
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/node
      - path: /usr/local/bin/node
