# OpenShell SandboxPolicy for the `metrics` fleet agent — deny-by-default.
# The metrics specialist may reach ONLY the Thanos querier (Prometheus API,
# telemetry-proxy:8080) with curl/node; everything else is denied. A subset of
# the governance interceptor's observability-egress ceiling (the interceptor
# only signs access it governs). Module 7 applies this at sandbox create:
#   openshell --gateway <gateway> sandbox create --name metrics \
#     --from quay.io/rh-ai-quickstart/openclaw-openshell:latest \
#     --policy automation/policies/sandbox-policy-fleet-metrics.yaml \
#     --no-tty --detach -- sh -c 'sleep 86400'
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - host: registry.openshell.svc.cluster.local
        port: 4873
        access: read-write
        protocol: rest
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/node
      - path: /usr/local/bin/node

  tool-egress:
    name: tool-egress
    endpoints:
      - host: telemetry-proxy.openshell-agents.svc.cluster.local
        port: 8080
        access: read-only
        protocol: rest
        enforcement: enforce
    binaries:
      - path: /usr/bin/node
      - path: /usr/local/bin/node
      - path: /usr/bin/curl
