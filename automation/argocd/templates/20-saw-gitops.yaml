# SAW GitOps root application — the app-of-apps that applies the hub children
# (sync-wave ordered):
#
#   w0 namespaces -> w1 subscriptions -> w2 vault -> w3 vault-config
#   -> w4 eso -> w5 openshift-cnv -> w6 pattern-secrets
#   -> w7 keycloak + governance -> w8 saw-bom -> w9 saw-users
#
# Rendered by the RHDP field-content chart (this chart): the order's gitops
# path deploys the SAW tree automatically, like the capstone child. Without
# the order pointer, apply the manifest form instead:
#
#   oc apply -f automation/argocd/saw/root-application.yaml
#
# The Application watches this repository's automation/argocd/saw/hub
# directory on the gitops-updates branch (the branch the SAW charts and site
# values are validated on).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saw-gitops
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  source:
    repoURL: https://github.com/taylorjordanNC/rhai-agent-security
    targetRevision: gitops-updates
    path: automation/argocd/saw/hub
    directory:
      include: "*.yaml"
  ignoreDifferences:
    # The openshift-cnv namespace collects labels from controllers this tree
    # does not own (the SCC pod-security label sync, OLM operator groups,
    # cluster monitoring). A self-healing sync preserves them (client-side
    # apply keeps fields outside last-applied) but reports the drift forever —
    # ignore the namespace's labels so the app settles Synced.
    - group: ""
      kind: Namespace
      name: openshift-cnv
      jsonPointers: ["/metadata/labels"]
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - Validate=true
