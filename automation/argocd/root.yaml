# rhai-agent-security workshop — root app-of-apps Application.
#
# ONE pointer per cluster. Either the RHDP order's gitops path points at
# automation/argocd/apps (the order creates the root itself), or apply this
# file once:
#
#   oc apply -f automation/argocd/root.yaml
#
# Do not use both on the same cluster — two roots managing the same children
# fight over ownership. The children live in automation/argocd/apps.
#
# Argo instance: openshift-gitops (the GitOps operator default). For a cluster
# where Argo CD runs elsewhere, swap the namespace in this file and the
# children in one pass:
#
#   sed -i.bak 's/namespace: openshift-gitops/namespace: vp-gitops/g' \
#     automation/argocd/root.yaml automation/argocd/apps/*.yaml
#
# This Application is workshop-owned and independent of the SAW deployment:
# it works before, during, or after the SAW pattern install. Children that
# depend on SAW (capstone) hold in retry until SAW and the RHOAI MLflow
# operator are healthy — no manual re-apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhai-agent-security
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhai-agent-security-workshop
spec:
  project: default
  source:
    repoURL: https://github.com/taylorjordanNC/rhai-agent-security.git
    targetRevision: main
    path: automation/argocd/apps
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Children may pause or tweak their own sync policy (workshop maintenance);
    # the root must not self-heal those changes away.
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
        - /spec/syncPolicy/ignoreDifferences
