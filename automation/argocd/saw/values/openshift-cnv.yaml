# Site values for the openshift-cnv chart. The chart matches upstream and
# declares an empty HyperConverged spec: the operator populates its defaults.
# CNV 4.22 removed the HyperConverged useEmulation knob, so VMs on this
# cluster run on hardware virtualization (this control plane has nested
# virt). Emulated clusters (no /dev/kvm) are not supported by 4.22's
# declarative path — verify the emulation story separately before a fleet
# run on emulated hosts.
