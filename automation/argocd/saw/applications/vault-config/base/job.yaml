---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-config
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: vault-config
      restartPolicy: OnFailure
      containers:
        - name: vault-config
          image: hashicorp/vault:1.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/configure.sh"]
          env:
            # The vault server runs with tlsDisable (in-cluster HTTP); the
            # route/external TLS can be added later if needed.
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: vault-ca
              mountPath: /var/run/vault-ca
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: vault-config-scripts
            defaultMode: 0755
        - name: policy
          configMap:
            name: vault-config-scripts
            items:
              - key: hub.hcl
                path: hub.hcl
        - name: vault-ca
          configMap:
            name: service-ca.crt
