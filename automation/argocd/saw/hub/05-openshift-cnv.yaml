# OpenShift Virtualization (sync wave 5) — the SAW chart from the fork's
# workshop branch. The chart declares an empty HyperConverged spec (upstream
# shape; CNV 4.22 removed the useEmulation knob): the operator populates its
# defaults, so IgnoreExtraneous keeps the app Synced against them.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saw-openshift-cnv
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-cnv
  sources:
    - repoURL: https://github.com/taylorjordanNC/secure-agent-workspace
      targetRevision: workshop
      path: charts/openshift-cnv
      helm:
        valueFiles:
          - $values/automation/argocd/saw/values/openshift-cnv.yaml
    - repoURL: https://github.com/taylorjordanNC/rhai-agent-security
      targetRevision: gitops-updates
      path: automation/argocd/saw/values
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
