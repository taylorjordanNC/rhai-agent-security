# Governance policy (sync wave 7) — ConfigMaps for the sandbox policy and
# provider profiles (cosign-signed profiles; the interceptor mounts them).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saw-governance-policy
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell-agents
  sources:
    - repoURL: https://github.com/taylorjordanNC/secure-agent-workspace
      targetRevision: workshop
      path: charts/governance-policy
      helm:
        valueFiles:
          - $values/governance-policy.yaml
    - repoURL: https://github.com/taylorjordanNC/rhai-agent-security
      targetRevision: gitops-updates
      path: automation/argocd/saw/values
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
