# SAW GitOps namespaces (sync wave 0) — mirrors the fork's values-prod.yaml
# clusterGroup namespaces for the components the Argo path owns. Declared in
# parity with automation/argocd/capstone where objects are shared
# (openshell-agents is owned by the capstone app and deliberately omitted
# here; the redhat-ods-operator namespace and RHOAI subscription are also
# capstone-owned). Each namespace carries the labels the SAW chart injects so
# the two self-healing managers never churn each other.
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/managed-by: openshift-gitops
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-operator
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/managed-by: openshift-gitops
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: external-secrets-operator-group
  namespace: external-secrets-operator
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces: []
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cnv
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/managed-by: openshift-gitops
    # enforce privileged (CNV needs it); audit/warn are left to OpenShift's
    # SCC pod-security label sync — declaring them privileged here loops
    # against the sync, which rewrites them to restricted and stalls the
    # app-of-apps sync on this namespace's health.
    security.openshift.io/scc.podSecurityLabelSync: "true"
    pod-security.kubernetes.io/enforce: privileged
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-cnv-operator-group
  namespace: openshift-cnv
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces:
    - openshift-cnv
---
apiVersion: v1
kind: Namespace
metadata:
  name: saw-keycloak
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/managed-by: openshift-gitops
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: saw-keycloak-operator-group
  namespace: saw-keycloak
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces:
    - saw-keycloak
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: secure-agent-workspace
    argocd.argoproj.io/managed-by: openshift-gitops
    argocd.argoproj.io/sync-wave: "0"
