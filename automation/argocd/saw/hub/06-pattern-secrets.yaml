# Pattern secrets (sync wave 6) — ExternalSecret CRs pulling the seeded
# values from Vault (ssh keypair, inference, web-search) into
# openshell-agents. They resolve only after the vault is seeded.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saw-pattern-secrets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell-agents
  sources:
    - repoURL: https://github.com/taylorjordanNC/secure-agent-workspace
      targetRevision: workshop
      path: charts/pattern-secrets
      helm:
        valueFiles:
          - $values/pattern-secrets.yaml
    - repoURL: https://github.com/taylorjordanNC/rhai-agent-security
      targetRevision: main
      path: automation/argocd/saw/values
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
