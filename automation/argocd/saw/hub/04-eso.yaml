# External Secrets Operator (sync wave 4) — the vendored
# openshift-external-secrets framework chart. The ESO ExternalSecrets
# (pattern-secrets, wave 6) resolve only after this is healthy AND the vault
# is seeded with the provider keys.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saw-eso
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  source:
    repoURL: https://github.com/taylorjordanNC/rhai-agent-security
    targetRevision: gitops-updates
    path: automation/argocd/saw/applications/eso/base
    kustomize:
      # the base renders the vendored ESO chart via helmGlobals; the chart
      # lives in vendor/ (outside the base), so the root-only load restrictor
      # must be relaxed
      enableHelm: true
      loadRestrictor: LoadRestrictionsNone
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
