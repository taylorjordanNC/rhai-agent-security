# SAW-BOM (sync wave 8) — the versioned bill of materials chart the per-user
# sandboxes mount (digest-pinned components installed in-guest).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saw-bom
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell-agents
  sources:
    - repoURL: https://github.com/taylorjordanNC/secure-agent-workspace
      targetRevision: workshop
      path: charts/saw-bom
      helm:
        valueFiles:
          - $values/saw-bom.yaml
    - repoURL: https://github.com/taylorjordanNC/rhai-agent-security
      targetRevision: main
      path: automation/argocd/saw/values
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
